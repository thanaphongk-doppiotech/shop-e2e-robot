[tool.robocop.format]
select = [
    "AlignSettingsSection",
    "AlignVariablesSection",
    "AlignKeywordsSection",
    "AlignTestCasesSection",
    "AlignTemplatedTestCases",
    "RenameKeywords",
]
configure = [
    "AlignKeywordsSection.alignment_type=auto",
    "AlignKeywordsSection.handle_too_long=compact_overflow",
    "AlignKeywordsSection.align_settings_separately=True",
    "AlignTestCasesSection.alignment_type=auto",
    "AlignTestCasesSection.handle_too_long=compact_overflow",
    "AlignTestCasesSection.align_settings_separately=True",
    "RenameKeywords.keyword_case=capitalize_first",
    "RenameKeywords.case_normalization=full",
]

[tool.robocop.lint]
select = [
    "wrong-case-in-keyword-name",
    "trailing-whitespace",
    "too-many-trailing-blank-lines",
    "missing-trailing-blank-line",
    "unused-argument",
    "argument-overwritten-before-usage",
    "undefined-argument-default",
    "undefined-argument-value",
    "duplicated-argument-name",
    "missing-space-after-comment",
    "missing-doc-keyword",
    "missing-doc-test-case",
    "too-long-keyword",
    "too-many-arguments",
    "empty-test-template",
    "empty-test-setup",
    "empty-test-teardown",
    "empty-force-tags",
    "test-case-name-is-empty",
    "not-capitalized-test-case-title",
    "not-allowed-char-in-filename",
    "argument-overwritten-before-usage",
    "undefined-argument-value",
    "undefined-argument-default",
    "duplicated-argument-name",
    "duplicated-variable",
    "duplicated-resource",
    "duplicated-keyword",
    "duplicated-variable",
    "variable-name-no-space",
    "commented-out-code",
    "invalid-locator-file-extension",
    "invalid-page-file-extension",
    "invalid-feature-file-extension",
    "tag-duplicate",
    "tag-contains-space",
    "duplicated-dict-key",
]
configure = [
    "too-long-keyword.severity_threshold=error=500",
    "too-long-test-case.severity_threshold=error=300",
    "too-many-arguments.severity_threshold=error=100",
    "wrong-case-in-keyword-name.convention=first_word_capitalized",
]
